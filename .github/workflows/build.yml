name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Source/HeadPainBoost/HeadPainBoost.csproj

      - name: Build
        run: dotnet build Source/HeadPainBoost/HeadPainBoost.csproj -c Release

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: HeadPainBoost
          path: |
            About/
            Defs/
            Assemblies/
